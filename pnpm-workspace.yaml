allowBuilds:
  esbuild: true

# pnpm rejects any dependency published within the last 24 hours
# (minimumReleaseAge), a supply-chain guard against a compromised package
# being published and pulled straight into a build. That guard is aimed at
# third-party code. `agentchatme` is OUR SDK, released from our own gated
# pipeline (as agent-core and the integrations already exclude it); without
# this, every SDK release would block this repo for a full day. Anything we
# do not publish ourselves stays subject to the policy.
minimumReleaseAgeExclude:
  - "postcss@8.5.25"
  - agentchatme

overrides:
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "fast-uri@>=3.0.0 <3.1.7": "3.1.7"
  "hono@<4.12.27": "4.12.27"
  "postcss@>=8.0.0 <8.5.18": "8.5.25"
  "proxy-addr@>=1.1.0 <2.0.8": "2.0.8"
  "qs@>=6.11.1 <6.15.2": "6.15.2"
  "vite@>=7.0.0 <7.3.5": "7.3.5"

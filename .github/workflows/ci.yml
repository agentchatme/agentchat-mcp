name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # npx runs outside the checkout: a semver already in node_modules
      # (without a root bin link) would shadow the one it fetches.
      - name: engines.node admits Node 22
        shell: bash
        run: |
          range="$(node -p 'require("./package.json").engines.node')"
          cd "$RUNNER_TEMP" && npx -y semver@7.7.4 -r "$range" "$(node -v)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build

      # Node 24 and 26, in this same job so the required checks stay
      # `test (<os>)` and gate on every line. npm installs the newest version
      # whose engines.node admits the running Node and silently skips the
      # rest, so a range that stops below a current Node line makes
      # `npm install` and `npx` there pick an old release. pnpm does not
      # enforce the range, and passing tests would not show it: each leg
      # checks the range admits its Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: engines.node admits Node 24
        shell: bash
        run: |
          range="$(node -p 'require("./package.json").engines.node')"
          cd "$RUNNER_TEMP" && npx -y semver@7.7.4 -r "$range" "$(node -v)"
      - name: install on Node 24
        run: pnpm install --frozen-lockfile
      - name: test on Node 24
        run: pnpm run test
      - name: build on Node 24
        run: pnpm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: engines.node admits Node 26
        shell: bash
        run: |
          range="$(node -p 'require("./package.json").engines.node')"
          cd "$RUNNER_TEMP" && npx -y semver@7.7.4 -r "$range" "$(node -v)"
      - name: install on Node 26
        run: pnpm install --frozen-lockfile
      - name: test on Node 26
        run: pnpm run test
      - name: build on Node 26
        run: pnpm run build

  # Secret scan of the new commits only: the pull request's range, or the
  # push's. The default gitleaks rules plus the AgentChat API key rule
  # (.gitleaks.toml).
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checksum-pinned, cached: a download happens only on a cache miss
      # (.github/actions/install-pinned-binary).
      - uses: ./.github/actions/install-pinned-binary
        with:
          name: gitleaks
          version: 8.30.1
          url: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          binary: gitleaks

      - name: Select commits to scan
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "range=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          # A new branch (all-zero before) or a manual dispatch (no before):
          # the head commit.
          elif [[ "$BEFORE_SHA" =~ ^0*$ ]]; then
            echo "range=${HEAD_SHA}^..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${BEFORE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan new commits for secrets
        run: >-
          gitleaks git
          --redact
          --no-banner
          --log-opts="${{ steps.commits.outputs.range }}"
          .
